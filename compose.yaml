services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - social-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  social-data:
